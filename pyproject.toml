[build-system]
requires = ["setuptools>=69,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "project-golem2"
version = "1.0.0"
description = "A local, attributable semantic Wikipedia graph visualizer."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "CyberMagician" }]
dependencies = [
    "Flask>=3.1,<4.0",
    "huggingface-hub>=1.3,<2.0",
    "numpy>=2.1,<3.0",
    "Pillow>=10.4,<12.0",
    "requests>=2.32,<3.0",
    "sentence-transformers>=6.1.0,<7.0",
    "torch>=2.7,<3.0",
    "transformers>=5.19.0,<6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9.0"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
golem2 = ["static/*.css", "static/*.html", "static/*.js"]
